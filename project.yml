name: ILand
options:
  developmentLanguage: de
  bundleIdPrefix: ch.yannis
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: 7NAS48FD56
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
targets:
  ILand:
    type: application
    platform: iOS
    sources: [ILand, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.yannis.ILand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: ILand/Info.plist
        CODE_SIGN_ENTITLEMENTS: ILand/ILand.entitlements
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "BrandAssets.xcassets Brands.json BrandLicenses BrandSources.json SimpleIcons-*.md"
    dependencies:
      - target: ILandWidgets
  ILandWidgets:
    type: app-extension
    platform: iOS
    sources: [ILandWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.yannis.ILand.widgets
        INFOPLIST_FILE: ILandWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ILand/ILand.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "BrandAssets.xcassets Brands.json BrandLicenses BrandSources.json SimpleIcons-*.md"
  ILandTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ILand
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ILandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ILand
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ILand
schemes:
  ILand:
    build:
      targets:
        ILand: all
    test:
      targets: [ILandTests, ILandUITests]
